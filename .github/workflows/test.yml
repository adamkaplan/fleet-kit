# Offline test suites. No network beyond checkout, read-only token; one optional secret (PRIVATE_NAMES) for the public-names check.
name: test

on:
  # ready_for_review: a draft into main skips the macOS leg (see the `plan` job); marking it ready starts it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The nightly: the default branch's workflow file only; the `plan` job runs it for main AND integration (a matrix of refs).
  schedule:
    - cron: "0 5 * * *"
  # A head can be re-run without a push or a close and reopen: `gh workflow run test.yml --ref <branch>`. No inputs. The run is on the branch's head
  # commit, so its checks (the same check names as a pull request run) count for that head. Its concurrency group is its commit sha:
  # it never cancels the pull request's own run, and cancel-in-progress is false for it.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older, superseded run (the macOS job queues for an hour when every push keeps
# its own run). A push to main has a group of its OWN (its commit sha) and cancel-in-progress is false for it: no run of a push to main is ever
# cancelled, running or pending (a shared group would let GitHub drop a pending run when a third push queued behind it).
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides the runners, in seconds. A job skipped by its own `if` would leave the required name `test (macos-latest)` unreported
  # (a skipped MATRIX job reports under its unexpanded name), so the macOS entry is in or out of the MATRIX instead:
  #   - a pull request into main: both legs, macOS unconditional (a draft into main skips macOS until ready_for_review);
  #   - a pull request into any other branch (integration): macOS only when its diff touches a path of the ONE list file, read from the BASE branch, or edits that file, or changes a file under .github/workflows/ (those two are hard-coded in the script);
  #   - a push, a dispatch: both legs; the nightly: main and integration, each leg named `nightly <ref> (<os>)`.
  # No third-party action: a plain `git diff --no-renames --name-only`.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide the runners
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, subprocess
          event, base, draft = os.environ["EVENT"], os.environ.get("BASE", ""), os.environ.get("DRAFT") == "true"
          def git(*args):
              return subprocess.run(["git"] + list(args), capture_output=True, text=True)
          # Hard-coded here, independent of the list: the list file itself and the workflow directory. Everything else comes from the BASE list.
          LIST = ".github/macos-platform-paths.txt"
          WORKFLOWS = ".github/workflows/"
          def note(message):
              # The step log AND the step summary, so the run page shows why macOS ran.
              print(message)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      summary.write(message + "\n\n")
          macos = True
          if event == "pull_request":
              if base == "main":
                  macos = not draft
              else:
                  # The list is read from the BASE, never from this pull request's own checkout: a pull request cannot rewrite the
                  # list that gates it. A list edit and a change under the workflow directory always run macOS (both paths are fixed here, not read from the list).
                  shown = git("show", "origin/" + base + ":" + LIST)
                  patterns = [l.strip() for l in shown.stdout.splitlines() if l.strip() and not l.lstrip().startswith("#")] if shown.returncode == 0 else []
                  if not patterns:
                      note("the platform-path list on origin/%s cannot be read or holds no pattern: running macOS (fail safe)" % base)
                  else:
                      # --no-renames: a file moved OUT of a listed path is seen under its old name too.
                      diff = git("diff", "--no-renames", "--name-only", "origin/" + base + "...HEAD")
                      if diff.returncode != 0:
                          note("the diff against origin/%s failed: running macOS (fail safe)" % base)
                      files = diff.stdout.splitlines()
                      if LIST in files:
                          note("the platform-path list is edited by this pull request: running macOS")
                      if any(f.startswith(WORKFLOWS) for f in files):
                          note("a workflow file is changed by this pull request: running macOS")
                      macos = diff.returncode != 0 or LIST in files or any(f.startswith(WORKFLOWS) for f in files) or any(fnmatch.fnmatchcase(f, p) for f in files for p in patterns)
          oses = ["ubuntu-latest"] + (["macos-latest"] if macos else [])
          rows = []
          if event == "schedule":
              refs = ["main"] + (["integration"] if git("rev-parse", "--verify", "-q", "refs/remotes/origin/integration").returncode == 0 else [])
              rows = [dict(os=o, ref=r, name="nightly %s (%s)" % (r, o), cloud="nightly-cloud %s (%s)" % (r, o)) for r in refs for o in ["ubuntu-latest", "macos-latest"]]
          else:
              rows = [dict(os=o, ref="", name="test (%s)" % o, cloud="test-cloud (%s)" % o) for o in oses]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(rows, separators=(",", ":")) + "\n")
          PY

  test:
    needs: plan
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Explicit bash gives -eo pipefail, so a suite's exit code survives the tee.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: test-fleet-doctor-heartbeat compares against a baseline commit.
          fetch-depth: 0
          # Empty for every run but the nightly: the event's own ref. The nightly checks out its leg's branch.
          ref: ${{ matrix.ref }}

      - run: python3 --version

      # This repo is public: refuse private names. The list lives in the repository secret PRIVATE_NAMES (never in the
      # tree); without it (a fork's pull request has no secrets) the check prints a "skipped" note and passes.
      - name: bin/check-public-names
        env:
          FLEET_PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: python3 bin/check-public-names

      # Each suite exits non-zero on failure; the grep also fails the step if
      # the last RESULT line is anything other than PASS.
      - name: bin/test-heartbeat
        run: |
          bin/test-heartbeat 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-health-records
        if: ${{ !cancelled() }}
        run: |
          bin/test-health-records 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-fleet-doctor
        if: ${{ !cancelled() }}
        run: |
          bin/test-fleet-doctor 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-fleet-doctor-config
        if: ${{ !cancelled() }}
        run: |
          bin/test-fleet-doctor-config 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-fleet-doctor-heartbeat
        if: ${{ !cancelled() }}
        run: |
          bin/test-fleet-doctor-heartbeat 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-switchboard
        if: ${{ !cancelled() }}
        run: |
          bin/test-switchboard 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-workflow-split
        if: ${{ !cancelled() }}
        run: |
          bin/test-workflow-split 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-gh-hold
        if: ${{ !cancelled() }}
        run: |
          bin/test-gh-hold 2>&1 | tee "$RUNNER_TEMP/out-hold.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out-hold.txt"

      - name: bin/test-app-mint
        if: ${{ !cancelled() }}
        run: |
          bin/test-app-mint 2>&1 | tee "$RUNNER_TEMP/out-app.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out-app.txt"

      - name: bin/test-cloud-neutral-names
        if: ${{ !cancelled() }}
        run: |
          bin/test-cloud-neutral-names 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      # The image-scan cases build images FROM a pulled base image (network): skipped here, with a visible "skip docker" line.
      - name: cloud/tests/test-cloud
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          CLOUD_TEST_SKIP_DOCKER: "1"
        run: |
          cloud/tests/test-cloud 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: node --test plugins/fleet-decisions-tui/health.test.mjs
        if: ${{ !cancelled() }}
        run: node --test plugins/fleet-decisions-tui/health.test.mjs

      - name: bin/fleet-scenario validate
        if: ${{ !cancelled() }}
        run: bin/fleet-scenario validate

      - name: bin/fleet-scenario coverage
        if: ${{ !cancelled() }}
        run: bin/fleet-scenario coverage --enforce --through-pr 4

  # The cloud suites run beside the job above, not after it (both need only `plan`): the macOS check ends at the slower of the two. Check names:
  # `test-cloud (<os>)` for the two operating systems (`nightly-cloud <ref> (<os>)` in the nightly). Same matrix, runner and shell as `test`.
  test-cloud:
    needs: plan
    name: ${{ matrix.cloud }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Explicit bash gives -eo pipefail, so a suite's exit code survives the tee.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: test-fleet-doctor-heartbeat compares against a baseline commit.
          fetch-depth: 0
          # Empty for every run but the nightly: the event's own ref. The nightly checks out its leg's branch.
          ref: ${{ matrix.ref }}

      - run: python3 --version

      - name: bin/test-cloud-worker
        if: ${{ !cancelled() }}
        run: |
          bin/test-cloud-worker 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-launcher
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          bin/test-cloud-launcher 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-hub
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bin/test-cloud-hub 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-channel
        if: ${{ !cancelled() }}
        run: |
          bin/test-cloud-channel 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-channel-server
        if: ${{ !cancelled() }}
        run: |
          bin/test-cloud-channel-server 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-client
        if: ${{ !cancelled() }}
        run: |
          bin/test-cloud-client 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-way-back
        if: ${{ !cancelled() }}
        run: |
          bin/test-cloud-way-back 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-decisions-pull
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bin/test-decisions-pull 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-cli
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bin/test-cloud-cli 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-relay
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bin/test-cloud-relay 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-hub-relay
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bin/test-cloud-hub-relay 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-cloud-relay-daemon
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bin/test-cloud-relay-daemon 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"
