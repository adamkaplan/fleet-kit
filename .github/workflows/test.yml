# Offline test suites. No network beyond checkout, read-only token; one optional secret (PRIVATE_NAMES) for the public-names check.
name: test

on:
  pull_request:
  push:
    branches: [main]
  # A head can be re-run without a push or a close and reopen: `gh workflow run test.yml --ref <branch>`. No inputs. The run is on the branch's head
  # commit, so its checks (the same check names as a pull request run) count for that head. Its concurrency group is its commit sha:
  # it never cancels the pull request's own run, and cancel-in-progress is false for it.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older, superseded run (the macOS job queues for an hour when every push keeps
# its own run). A push to main has a group of its OWN (its commit sha) and cancel-in-progress is false for it: no run of a push to main is ever
# cancelled, running or pending (a shared group would let GitHub drop a pending run when a third push queued behind it).
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Explicit bash gives -eo pipefail, so a suite's exit code survives the tee.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: test-fleet-doctor-heartbeat compares against a baseline commit.
          fetch-depth: 0

      - run: python3 --version

      # This repo is public: refuse private names. The list lives in the repository secret PRIVATE_NAMES (never in the
      # tree); without it (a fork's pull request has no secrets) the check prints a "skipped" note and passes.
      - name: bin/check-public-names
        env:
          FLEET_PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: python3 bin/check-public-names

      # Each suite exits non-zero on failure; the grep also fails the step if
      # the last RESULT line is anything other than PASS.
      - name: bin/test-heartbeat
        run: |
          bin/test-heartbeat 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-fleet-doctor
        if: ${{ !cancelled() }}
        run: |
          bin/test-fleet-doctor 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-fleet-doctor-config
        if: ${{ !cancelled() }}
        run: |
          bin/test-fleet-doctor-config 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-fleet-doctor-heartbeat
        if: ${{ !cancelled() }}
        run: |
          bin/test-fleet-doctor-heartbeat 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/test-switchboard
        if: ${{ !cancelled() }}
        run: |
          bin/test-switchboard 2>&1 | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'RESULT: PASS' "$RUNNER_TEMP/out.txt"

      - name: bin/fleet-scenario validate
        if: ${{ !cancelled() }}
        run: bin/fleet-scenario validate

      - name: bin/fleet-scenario coverage
        if: ${{ !cancelled() }}
        run: bin/fleet-scenario coverage --enforce --through-pr 4
