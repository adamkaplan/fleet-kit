# Narrow RBAC for the cw-operator ServiceAccount (namespace cw), required by remediate_wedged_kata_nodes (bin/cloud_floor.py)
# and tools/sync-in-cluster-switchboard: node get/list/watch/patch, pod get/list/delete in cw-floor-kata, deployment get/list/watch/patch in cw.
# No wildcard anywhere. (JSON is valid YAML: written as JSON documents so the offline test needs no YAML library.)
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "cw-operator-node-remediation"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "patch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": "cw-operator-node-remediation"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": "cw-operator-node-remediation"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "cw-operator",
      "namespace": "cw"
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "cw-operator-kata-pods",
    "namespace": "cw-floor-kata"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list",
        "delete"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "cw-operator-kata-pods",
    "namespace": "cw-floor-kata"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "cw-operator-kata-pods"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "cw-operator",
      "namespace": "cw"
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "cw-operator-deployments",
    "namespace": "cw"
  },
  "rules": [
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "deployments"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "patch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "cw-operator-deployments",
    "namespace": "cw"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "cw-operator-deployments"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "cw-operator",
      "namespace": "cw"
    }
  ]
}
