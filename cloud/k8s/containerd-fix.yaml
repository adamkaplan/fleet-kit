# Repairs the containerd registration of Sysbox on nodes whose containerd is 2.x.
# The stock Sysbox installer writes the sysbox-runc stanza under the legacy plugin key
# io.containerd.grpc.v1.cri, which containerd 2.x ignores; it reads
# io.containerd.cri.v1.runtime. This DaemonSet moves the stanza, validates the result,
# restarts containerd only if it changed something, and does nothing on a node that is
# already right. It runs only on nodes labelled sysbox-install=yes, waits for the stock
# installer to write its stanza, and on success labels the node sysbox-runtime=running
# (which the RuntimeClass schedules on). It is idempotent: safe to run again.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sysbox-containerd-fix
  namespace: kube-system
data:
  fix.sh: |
    #!/bin/sh
    # Test hooks: CFG (config path), HOST (command prefix that runs on the node), LABEL_CMD, READY_CMD,
    # WAIT and POLL (seconds: how long and how often to check health after a restart),
    # ONCE=1 (one pass, then exit), MAX_BAD (invalid-config tries before exiting non-zero).
    set -eu
    CFG=${CFG:-/host/etc/containerd/config.toml}
    HOST=${HOST:-nsenter -t 1 -m -u -i -n -p --}
    LABEL_CMD=${LABEL_CMD:-kubectl label node $NODE_NAME sysbox-runtime=running --overwrite}
    NEW="io.containerd.cri.v1.runtime"
    OLD="io.containerd.grpc.v1.cri"
    bad=0
    WAIT=${WAIT:-60}; POLL=${POLL:-2}
    # A failed restart (rolled back) is recorded in a marker on the node, beside the config, so
    # the count survives pod restarts. At MAX_ATTEMPTS the fix stays off: it edits nothing,
    # restarts nothing, labels nothing, and idles. To retry, delete the marker AND the in-progress flag on the node.
    MARKER="$CFG.sysbox-fix.failed"; MAX_ATTEMPTS=${MAX_ATTEMPTS:-2}
    restore_backup() { cp "$CFG.sysbox-fix.bak" "$CFG.restore.tmp" && mv "$CFG.restore.tmp" "$CFG" && sync; }

    # After a restart: containerd must answer and the node must be Ready within WAIT seconds.
    # "Answers" means `ctr version` succeeds: ctr talks to the running daemon over its socket and
    # fails when the daemon is dead (`containerd config dump` only prints config computed from
    # files, so it can succeed with containerd down). Each probe is bounded by `timeout` on the host.
    node_ready() {
      if [ -n "${READY_CMD:-}" ]; then $READY_CMD
      else kubectl get node "$NODE_NAME" -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}' | grep -qx True; fi
    }
    # WAIT is a clock, not a loop count: the deadline is the start time plus WAIT (date +%s), so the
    # wait ends within WAIT + one probe bound (10s) + POLL however slow the probes are.
    healthy_after_restart() {
      deadline=$(( $(date +%s) + WAIT ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        if $HOST timeout 10 ctr version >/dev/null 2>&1 && node_ready >/dev/null 2>&1; then return 0; fi
        sleep "$POLL"
      done
      return 1
    }
    # Restart containerd and check it is healthy: any failure of either is a failure.
    restart_and_check() { $HOST systemctl restart containerd || return 1; healthy_after_restart; }
    # The node cannot be brought back by this script: set the marker to the cap at once (no retry by the
    # script: a crash loop of containerd restarts on a node that needs a person), keep the in-progress flag.
    set_cap() {
      { printf 'count=%s\ntime=%s\n' "$MAX_ATTEMPTS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER.tmp" && mv "$MARKER.tmp" "$MARKER" && sync; } \
        || echo "WARNING: could not set the cap in $MARKER" >&2
    }
    manual_repair() {
      armed=0   # nothing more the trap could do
      set_cap
      echo "config restore FAILED: node needs manual repair: $CFG (saved copy: $CFG.sysbox-fix.bak); then rm -f $MARKER $INPROG" >&2; exit 1
    }
    # CRITICAL SECTION. From just before the config is edited until the health check has passed, a file flag on the node beside the config says "in progress" (fail closed:
    # the flag is removed only on completion or after a verified restore). Two mechanisms use it:
    #  - the TRAP (TERM, INT, EXIT) covers a run that is stopped but still alive to react: pod deleted
    #    (SIGTERM), Ctrl-C, or any exit while armed=1. It takes the rollback path below, once.
    #  - the RECOVERY AT START covers a run that was SIGKILLed (no trap can run): the flag is still
    #    there when the next pod starts, so that pod rolls back first and counts one failed attempt.
    INPROG="$CFG.sysbox-fix.inprogress"; armed=0
    # Roll back: record the failed attempt, restore the saved config byte for byte, restart and check
    # again. Returns only when all of that succeeded (then clears the flag); otherwise exits 1.
    # Disarms first, so the trap can never run it a second time. Never labels.
    # "restored" is printed only when the restore, the restart and the health check all succeeded.
    rollback_core() {
      armed=0
      echo "ERROR: $1: rolling back" >&2
      prev=$(sed -n 's/^count=\([0-9][0-9]*\)$/\1/p' "$MARKER" 2>/dev/null | head -n 1)
      case "$prev" in ''|*[!0-9]*) prev=0 ;; esac
      { printf 'count=%s\ntime=%s\n' "$((prev + 1))" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER.tmp" && mv "$MARKER.tmp" "$MARKER" && sync; } \
        || echo "WARNING: could not record the failed attempt in $MARKER" >&2
      if ! restore_backup || ! cmp -s "$CFG.sysbox-fix.bak" "$CFG"; then manual_repair; fi
      if ! restart_and_check; then
        set_cap
        echo "config restored but containerd is NOT healthy after the second restart: node needs manual repair: $CFG (then rm -f $MARKER $INPROG)" >&2; exit 1
      fi
      rm -f "$INPROG"
      echo "ERROR: config restored, containerd healthy again; failed attempt $((prev + 1)) recorded in $MARKER" >&2
    }
    rollback() {
      rollback_core "containerd restart failed or containerd/node not healthy within ${WAIT}s"
      echo "ERROR: exiting non-zero" >&2; exit 1
    }
    # TERM and INT turn into an exit, so every stop goes through the one EXIT handler. The handler
    # disarms its own traps first (no recursion); a normal exit (armed=0) passes its status through.
    on_exit() {
      rc=$?; trap - TERM INT EXIT
      if [ "$armed" = 1 ]; then
        rollback_core "run stopped (signal or exit, status $rc) before containerd was proven healthy"
        echo "ERROR: run did not complete; config rolled back; exiting non-zero; node not labelled" >&2
        [ "$rc" = 0 ] && rc=1
      fi
      exit "$rc"
    }
    trap 'exit 143' TERM; trap 'exit 130' INT; trap on_exit EXIT
    # A previous run was killed mid-way (SIGKILL: no trap ran) and left the flag: roll back first. It
    # counts as one failed attempt; the cap check in the loop then decides to go on or stay off.
    # The cap comes FIRST: at the cap (or an unreadable marker) nothing is restarted and nothing is recovered;
    # the flag stays as it is and the pod idles quietly until an operator resets both files.
    cap_reached() {
      [ -e "$MARKER" ] || return 1
      n=$(sed -n 's/^count=\([0-9][0-9]*\)$/\1/p' "$MARKER" 2>/dev/null | head -n 1)
      case "$n" in ''|*[!0-9]*) n=$MAX_ATTEMPTS ;; esac   # unreadable marker: fail closed
      [ "$n" -ge "$MAX_ATTEMPTS" ]
    }
    idle_disabled() {
      echo "sysbox fix disabled on this node after $n failed attempts; to retry, remove both files on the node: rm -f $MARKER $INPROG" >&2
      [ "${ONCE:-0}" = 1 ] && exit 4
      while true; do sleep 3600; done
    }
    if cap_reached; then idle_disabled; fi
    if [ -e "$INPROG" ]; then
      rollback_core "a previous run was killed before it finished (in-progress flag found)"
    fi

    while true; do
      if cap_reached; then idle_disabled; fi
      if [ ! -f "$CFG" ] || ! grep -q 'runtimes[."'"'"']*sysbox-runc' "$CFG"; then
        echo "waiting for the Sysbox installer to register sysbox-runc"
        [ "${ONCE:-0}" = 1 ] && exit 3
        sleep 15; continue
      fi
      # containerd config version: this fix only knows the v2/v3 plugin keys. Refuse a v1 file
      # (declared, or no version line and only the legacy key) before touching anything.
      if grep -Eq '^[[:space:]]*version[[:space:]]*=[[:space:]]*1[[:space:]]*(#.*)?$' "$CFG" \
         || { ! grep -Eq '^[[:space:]]*version[[:space:]]*=' "$CFG" && ! grep -q "$NEW" "$CFG"; }; then
        echo "containerd config is version 1: this fix handles version 2 and 3 only; node untouched" >&2; exit 1
      fi
      HDR="^[[:space:]]*\\[plugins\\.[\"']"
      if grep -Eq "${HDR}$NEW[\"']\\.containerd\\.runtimes\\.sysbox-runc\\]" "$CFG" \
         && ! grep -Eq "${HDR}$OLD[\"']\\.containerd\\.runtimes\\.sysbox-runc" "$CFG"; then
        echo "sysbox-runc already under $NEW: nothing to do"
        # label only a node whose containerd answers and which is Ready
        healthy_after_restart || { echo "sysbox-runc is registered but containerd or the node is not healthy: not labelling" >&2; exit 1; }
        $LABEL_CMD >/dev/null
      else
        cp "$CFG" "$CFG.sysbox-fix.bak"
        # Table headers may be indented and use either quote style. Rename the key on the
        # sysbox-runc tables (and .options) only; then drop the legacy parent headers
        # ([plugins.OLD], .containerd, .containerd.runtimes) that are left with no keys and no
        # child tables. A renamed table whose new name already exists is dropped.
        awk -v OLD="$OLD" -v NEW="$NEW" '
          function norm(l) { sub(/^[ \t]*\[/, "", l); sub(/\].*$/, "", l); gsub(/\047/, "\"", l); return l }
          BEGIN { s = 0 }
          { line[NR] = $0
            if ($0 ~ /^[ \t]*\[[^[]/) { s++; hn[s] = norm($0) } 
            sec[NR] = s }
          END {
            P = "plugins.\"" OLD "\""; Q = "plugins.\"" NEW "\""
            R = P ".containerd.runtimes.sysbox-runc"
            for (i = 1; i <= s; i++) { n = hn[i]
              if (n == R || index(n, R ".") == 1) ren[i] = 1; else seen[n] = 1 }
            for (i = 1; i <= s; i++) { if (ren[i]) {
              nn = Q substr(hn[i], length(P) + 1)
              if (nn in seen) drop[i] = 1; else { seen[nn] = 1; fin[i] = nn } } else fin[i] = hn[i] }
            for (n = 1; n <= NR; n++) if (sec[n] > 0 && line[n] !~ /^[ \t]*(#.*)?$/ && line[n] !~ /^[ \t]*\[/) body[sec[n]] = 1
            split(P ".containerd.runtimes|" P ".containerd|" P, par, "|")
            for (k = 1; k <= 3; k++) for (i = 1; i <= s; i++) if (!drop[i] && hn[i] == par[k] && !ren[i] && !body[i]) {
              kids = 0
              for (j = 1; j <= s; j++) if (j != i && !drop[j] && index(fin[j], par[k] ".") == 1) kids = 1
              if (!kids) drop[i] = 1 }
            for (n = 1; n <= NR; n++) { i = sec[n]
              if (i > 0 && drop[i]) continue
              l = line[n]
              if (i > 0 && ren[i] && l ~ /^[ \t]*\[/) { p = index(l, OLD); l = substr(l, 1, p - 1) NEW substr(l, p + length(OLD)) }
              print l } }' "$CFG" > "$CFG.tmp"
        if sed -n -E 's/^[[:space:]]*\[([^[].*)\].*$/\1/p' "$CFG.tmp" | tr "'" '"' | sort | uniq -d | grep -q .; then
          echo "the rewrite would duplicate a table header: exiting non-zero" >&2; rm -f "$CFG.tmp"; exit 1
        fi
        if cmp -s "$CFG" "$CFG.tmp"; then
          rm -f "$CFG.tmp"
          echo "sysbox-runc is registered in a form this fix does not move: exiting non-zero" >&2; exit 1
        fi
        { : > "$INPROG" && sync; } || { echo "cannot write $INPROG: not editing the config" >&2; rm -f "$CFG.tmp"; exit 1; }
        armed=1
        mv "$CFG.tmp" "$CFG"; sync
        if $HOST containerd config dump >/dev/null 2>&1 \
           && $HOST containerd config dump | grep -q 'runtimes.sysbox-runc' \
           && grep -Eq "${HDR}$NEW[\"']\\.containerd\\.runtimes\\.sysbox-runc\\]" "$CFG"; then
          echo "config valid: restarting containerd"
          restart_and_check || rollback
          armed=0; rm -f "$INPROG"   # the health check passed: the critical section ends HERE, before labelling
          rm -f "$MARKER"
          # The label is not a health signal (the stock installer sets sysbox-runtime=running before containerd knows
          # the runtime); this script's own health check above is. Nothing may schedule on the label.
          # Labelling is outside the rollback window: a failed label or a signal during it must not undo a healthy
          # runtime. On failure exit non-zero; the next pass sees the config already right and retries the label.
          $LABEL_CMD >/dev/null || { echo "ERROR: runtime healthy but the label could not be set: exiting non-zero (config kept; the next pass retries the label)" >&2; exit 1; }
          bad=0
        else
          bad=$((bad + 1))
          echo "config invalid (try $bad): restoring backup" >&2
          if ! restore_backup || ! cmp -s "$CFG.sysbox-fix.bak" "$CFG"; then manual_repair; fi
          armed=0; rm -f "$INPROG"
          [ "$bad" -ge "${MAX_BAD:-5}" ] && { echo "giving up: pod exits non-zero" >&2; exit 1; }
          [ "${ONCE:-0}" = 1 ] && exit 1
          sleep 60; continue
        fi
      fi
      [ "${ONCE:-0}" = 1 ] && exit 0
      sleep 300
    done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sysbox-containerd-fix
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sysbox-containerd-fix
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sysbox-containerd-fix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sysbox-containerd-fix
subjects:
  - kind: ServiceAccount
    name: sysbox-containerd-fix
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysbox-containerd-fix
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: sysbox-containerd-fix
  template:
    metadata:
      labels:
        app: sysbox-containerd-fix
    spec:
      serviceAccountName: sysbox-containerd-fix
      # time for the trap's rollback (a restart and a WAIT) after SIGTERM; SIGKILL is covered at the next start
      terminationGracePeriodSeconds: 180
      hostPID: true
      nodeSelector:
        sysbox-install: "yes"
      containers:
        - name: fix
          # a small image with sh, sed, nsenter (util-linux) and kubectl
          image: alpine/k8s:1.33.4
          command: ["/bin/sh", "/scripts/fix.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: host-etc-containerd
              mountPath: /host/etc/containerd
      volumes:
        - name: scripts
          configMap:
            name: sysbox-containerd-fix
        - name: host-etc-containerd
          hostPath:
            path: /etc/containerd
            type: Directory
